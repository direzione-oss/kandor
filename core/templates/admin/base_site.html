{% extends "admin/base.html" %}
{% load i18n static %}

{% block title %}{{ title }} | Kandor Portal{% endblock %}

{% block extrastyle %}{{ block.super }}
<link rel="stylesheet" href="{% static 'core/css/kandor_theme.css' %}">{% endblock %}

{% block branding %}
<div id="branding">
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; text-decoration: none;">
            <img src="{% static 'core/img/logo.png' %}" alt="Kandor Logo"
                style="height: 40px; margin-right: 15px; background: white; padding: 5px; border-radius: 4px;">
            <span style="color: white; font-weight: bold;">Kandor Portal</span>
        </a>
    </h1>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}

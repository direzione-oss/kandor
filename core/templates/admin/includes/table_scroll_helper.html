<!-- Assistente di Scorrimento Orizzontale per Tabelle Ampie Kandor ERP (Dipendenti, Clienti, Turni, Timetrack) -->
<style>
  /* Cursore grab per scorrimento orizzontale tramite trascinamento */
  .results {
    cursor: grab;
    user-select: none;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #94A3B8 #F1F5F9;
  }
  .results.is-dragging {
    cursor: grabbing !important;
    user-select: none !important;
  }
  .results a, .results button, .results input, .results select, .results label {
    cursor: auto;
  }

  /* Barra di Scorrimento Superiore Sincronizzata */
  .kandor-top-scroll-container {
    background: #FFFFFF;
    border: 1px solid #CBD5E1;
    border-bottom: 2px solid #2563EB;
    border-radius: 10px 10px 0 0;
    padding: 8px 14px;
    margin-top: 14px;
    margin-bottom: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    display: none; /* attivato via JS solo se overflow */
  }

  .kandor-top-scroll-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }

  .kandor-top-scroll-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    color: #1E40AF;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .kandor-scroll-btn-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .kandor-scroll-btn {
    background: #F1F5F9;
    color: #0F172A;
    border: 1px solid #CBD5E1;
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    line-height: 1;
  }
  .kandor-scroll-btn:hover {
    background: #2563EB;
    color: #FFFFFF;
    border-color: #1D4ED8;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
  }
  .kandor-scroll-btn:active {
    transform: translateY(0);
  }

  /* Traccia scrollbar superiore fittizia sincronizzata */
  .kandor-top-scrollbar-track {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    height: 14px;
    scrollbar-width: auto;
    scrollbar-color: #3B82F6 #E2E8F0;
    border-radius: 7px;
  }
  .kandor-top-scrollbar-track::-webkit-scrollbar {
    height: 12px;
  }
  .kandor-top-scrollbar-track::-webkit-scrollbar-track {
    background: #E2E8F0;
    border-radius: 6px;
  }
  .kandor-top-scrollbar-track::-webkit-scrollbar-thumb {
    background: #3B82F6;
    border-radius: 6px;
  }
  .kandor-top-scrollbar-track::-webkit-scrollbar-thumb:hover {
    background: #1D4ED8;
  }
  .kandor-top-scrollbar-dummy {
    height: 1px;
    display: block;
  }

  /* BARRA FLOTTANTE INFERIORE (Sticky Floating Bottom Scrollbar) */
  .kandor-floating-scrollbar-bar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    z-index: 1050;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    padding: 8px 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    opacity: 0;
    pointer-events: none;
    max-width: 90vw;
    width: 580px;
    color: #FFFFFF;
  }
  .kandor-floating-scrollbar-bar.is-visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .kandor-floating-scrollbar-bar .kandor-fl-btn {
    background: rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .kandor-floating-scrollbar-bar .kandor-fl-btn:hover {
    background: #2563EB;
    border-color: #60A5FA;
    transform: scale(1.04);
  }

  .kandor-floating-range {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  .kandor-floating-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #60A5FA;
    border: 2px solid #FFFFFF;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .kandor-floating-range::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    background: #3B82F6;
  }
  .kandor-floating-range::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #60A5FA;
    border: 2px solid #FFFFFF;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    cursor: pointer;
  }

  .kandor-floating-badge {
    font-size: 0.74rem;
    font-weight: 700;
    color: #93C5FD;
    min-width: 42px;
    text-align: center;
    white-space: nowrap;
  }

  /* PULSANTI FLOTTANTI LATERALI SCHERMO (Fissi a bordo pagina per scorrimento con 1 clic) */
  .kandor-edge-nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 52px;
    background: rgba(15, 23, 42, 0.85);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 900;
    cursor: pointer;
    z-index: 1040;
    transition: all 0.2s ease;
    opacity: 0;
    pointer-events: none;
  }
  .kandor-edge-nav-btn.is-active {
    opacity: 0.82;
    pointer-events: auto;
  }
  .kandor-edge-nav-btn:hover {
    opacity: 1 !important;
    background: #2563EB;
    border-color: #60A5FA;
    transform: translateY(-50%) scale(1.08);
  }
  .kandor-edge-left {
    left: 14px;
  }
  .kandor-edge-right {
    right: 14px;
  }

  /* Suggerimento visivo leggero */
  .kandor-scroll-hint {
    font-size: 0.74rem;
    color: #64748B;
    font-weight: normal;
  }
</style>

<script>
(function() {
  function initTableScrollEnhancer() {
    var resultsEl = document.querySelector('.results');
    var tableEl = resultsEl ? resultsEl.querySelector('table#result_list, table') : null;
    if (!resultsEl || !tableEl) return;

    // Verifica se la tabella fuoriesce orizzontalmente
    function checkOverflow() {
      return (resultsEl.scrollWidth - resultsEl.clientWidth) > 15;
    }

    if (!checkOverflow()) {
      // Se non c'è overflow al momento, riprova dopo breve ritardo (nel caso di immagini o font in caricamento)
      setTimeout(function() {
        if (checkOverflow()) setupEnhancer();
      }, 350);
      return;
    }

    setupEnhancer();

    function setupEnhancer() {
      // 1. CREA LA BARRA SUPERIORE DI SCORRIMENTO SINCRONIZZATA
      if (!document.getElementById('kandor-top-scroll-wrap')) {
        var topWrap = document.createElement('div');
        topWrap.id = 'kandor-top-scroll-wrap';
        topWrap.className = 'kandor-top-scroll-container';
        topWrap.innerHTML = `
          <div class="kandor-top-scroll-header">
            <div class="kandor-top-scroll-title">
              <span>↔️ Scorrimento Orizzontale Tabella</span>
              <span class="kandor-scroll-hint">(Usa la barra, i pulsanti o trascina con il mouse)</span>
            </div>
            <div class="kandor-scroll-btn-group">
              <button type="button" class="kandor-scroll-btn" id="kandor-btn-start" title="Vai all'inizio (sinistra)">⏮️ Inizio</button>
              <button type="button" class="kandor-scroll-btn" id="kandor-btn-left" title="Scorri a sinistra">◀️ Sinistra</button>
              <button type="button" class="kandor-scroll-btn" id="kandor-btn-right" title="Scorri a destra">Destra ▶️</button>
              <button type="button" class="kandor-scroll-btn" id="kandor-btn-end" title="Vai alla fine (destra)">Fine ⏭️</button>
            </div>
          </div>
          <div class="kandor-top-scrollbar-track" id="kandor-top-track">
            <div class="kandor-top-scrollbar-dummy" id="kandor-top-dummy"></div>
          </div>
        `;
        resultsEl.parentNode.insertBefore(topWrap, resultsEl);
      }

      var topWrapEl = document.getElementById('kandor-top-scroll-wrap');
      var topTrack = document.getElementById('kandor-top-track');
      var topDummy = document.getElementById('kandor-top-dummy');

      // 2. CREA LA BARRA FLOTTANTE INFERIORE (Sticky Floating Bottom Scrollbar)
      if (!document.getElementById('kandor-floating-bar')) {
        var floatBar = document.createElement('div');
        floatBar.id = 'kandor-floating-bar';
        floatBar.className = 'kandor-floating-scrollbar-bar';
        floatBar.innerHTML = `
          <button type="button" class="kandor-fl-btn" id="kandor-fl-left">◀ Sinistra</button>
          <input type="range" class="kandor-floating-range" id="kandor-fl-range" min="0" max="100" value="0" step="1" title="Trascina per scorrere orizzontalmente">
          <span class="kandor-floating-badge" id="kandor-fl-badge">0%</span>
          <button type="button" class="kandor-fl-btn" id="kandor-fl-right">Destra ▶</button>
        `;
        document.body.appendChild(floatBar);
      }

      var floatBarEl = document.getElementById('kandor-floating-bar');
      var floatRange = document.getElementById('kandor-fl-range');
      var floatBadge = document.getElementById('kandor-fl-badge');
      var floatLeftBtn = document.getElementById('kandor-fl-left');
      var floatRightBtn = document.getElementById('kandor-fl-right');

      // 3. CREA I PULSANTI FLOTTANTI LATERALI DELLO SCHERMO
      if (!document.getElementById('kandor-edge-btn-left')) {
        var edgeLeft = document.createElement('button');
        edgeLeft.id = 'kandor-edge-btn-left';
        edgeLeft.className = 'kandor-edge-nav-btn kandor-edge-left';
        edgeLeft.innerHTML = '‹';
        edgeLeft.title = 'Scorri tabella a sinistra';
        document.body.appendChild(edgeLeft);

        var edgeRight = document.createElement('button');
        edgeRight.id = 'kandor-edge-btn-right';
        edgeRight.className = 'kandor-edge-nav-btn kandor-edge-right';
        edgeRight.innerHTML = '›';
        edgeRight.title = 'Scorri tabella a destra';
        document.body.appendChild(edgeRight);
      }

      var edgeLeftBtn = document.getElementById('kandor-edge-btn-left');
      var edgeRightBtn = document.getElementById('kandor-edge-btn-right');

      // SINCRONIZZAZIONE LARGHEZZE E STATO
      function syncDimensions() {
        var maxScroll = resultsEl.scrollWidth - resultsEl.clientWidth;
        if (maxScroll > 10) {
          topWrapEl.style.display = 'block';
          topDummy.style.width = resultsEl.scrollWidth + 'px';
          updateScrollPosition();
        } else {
          topWrapEl.style.display = 'none';
          floatBarEl.classList.remove('is-visible');
          edgeLeftBtn.classList.remove('is-active');
          edgeRightBtn.classList.remove('is-active');
        }
      }

      var isSyncingFromTop = false;
      var isSyncingFromResults = false;

      function updateScrollPosition() {
        var maxScroll = resultsEl.scrollWidth - resultsEl.clientWidth;
        if (maxScroll <= 0) return;
        var ratio = resultsEl.scrollLeft / maxScroll;
        var pct = Math.round(ratio * 100);

        if (!isSyncingFromTop && topTrack) {
          topTrack.scrollLeft = resultsEl.scrollLeft;
        }

        if (floatRange) floatRange.value = pct;
        if (floatBadge) floatBadge.textContent = pct + '%';

        // Aggiorna stato pulsanti bordo
        if (edgeLeftBtn && edgeRightBtn) {
          edgeLeftBtn.style.opacity = resultsEl.scrollLeft > 10 ? '0.85' : '0.25';
          edgeRightBtn.style.opacity = resultsEl.scrollLeft < (maxScroll - 10) ? '0.85' : '0.25';
        }
      }

      // Scroll della tabella verso Top Track
      resultsEl.addEventListener('scroll', function() {
        if (isSyncingFromTop) return;
        isSyncingFromResults = true;
        updateScrollPosition();
        isSyncingFromResults = false;
      }, { passive: true });

      // Scroll del Top Track verso Tabella
      topTrack.addEventListener('scroll', function() {
        if (isSyncingFromResults) return;
        isSyncingFromTop = true;
        resultsEl.scrollLeft = topTrack.scrollLeft;
        updateScrollPosition();
        isSyncingFromTop = false;
      }, { passive: true });

      // Range slider flottante
      floatRange.addEventListener('input', function() {
        var maxScroll = resultsEl.scrollWidth - resultsEl.clientWidth;
        var targetLeft = (parseFloat(floatRange.value) / 100) * maxScroll;
        resultsEl.scrollLeft = targetLeft;
        updateScrollPosition();
      });

      // Funzione di scorrimento graduale
      function scrollByDelta(delta) {
        resultsEl.scrollBy({ left: delta, behavior: 'smooth' });
      }

      // Eventi pulsanti barra superiore
      document.getElementById('kandor-btn-start').addEventListener('click', function() {
        resultsEl.scrollTo({ left: 0, behavior: 'smooth' });
      });
      document.getElementById('kandor-btn-end').addEventListener('click', function() {
        resultsEl.scrollTo({ left: resultsEl.scrollWidth, behavior: 'smooth' });
      });
      document.getElementById('kandor-btn-left').addEventListener('click', function() {
        scrollByDelta(-380);
      });
      document.getElementById('kandor-btn-right').addEventListener('click', function() {
        scrollByDelta(380);
      });

      // Eventi pulsanti barra flottante
      floatLeftBtn.addEventListener('click', function() {
        scrollByDelta(-380);
      });
      floatRightBtn.addEventListener('click', function() {
        scrollByDelta(380);
      });

      // Eventi pulsanti bordi schermo
      edgeLeftBtn.addEventListener('click', function() {
        scrollByDelta(-450);
      });
      edgeRightBtn.addEventListener('click', function() {
        scrollByDelta(450);
      });

      // VISIBILITÀ BARRA FLOTTANTE & PULSANTI BORDO IN BASE AL VERTICAL SCROLL
      function handleWindowScroll() {
        var maxScroll = resultsEl.scrollWidth - resultsEl.clientWidth;
        if (maxScroll <= 10) {
          floatBarEl.classList.remove('is-visible');
          edgeLeftBtn.classList.remove('is-active');
          edgeRightBtn.classList.remove('is-active');
          return;
        }

        var rect = resultsEl.getBoundingClientRect();
        var winHeight = window.innerHeight || document.documentElement.clientHeight;

        // La tabella è parzialmente visibile nello schermo
        var isTableInView = rect.top < (winHeight - 60) && rect.bottom > 120;
        // Il fondo della tabella è ancora fuori dallo schermo (più in basso)
        var bottomIsOffscreen = rect.bottom > winHeight;

        if (isTableInView && bottomIsOffscreen) {
          floatBarEl.classList.add('is-visible');
        } else {
          floatBarEl.classList.remove('is-visible');
        }

        if (isTableInView) {
          edgeLeftBtn.classList.add('is-active');
          edgeRightBtn.classList.add('is-active');
        } else {
          edgeLeftBtn.classList.remove('is-active');
          edgeRightBtn.classList.remove('is-active');
        }
      }

      window.addEventListener('scroll', handleWindowScroll, { passive: true });
      window.addEventListener('resize', function() {
        syncDimensions();
        handleWindowScroll();
      }, { passive: true });

      // DRAG TO SCROLL (Trascina con il mouse)
      var isDown = false;
      var startX = 0;
      var scrollLeftStart = 0;
      var hasMoved = false;

      resultsEl.addEventListener('mousedown', function(e) {
        // Ignora clic su elementi interattivi
        if (e.target.closest('a, button, input, select, label, textarea, .action-checkbox')) {
          return;
        }
        isDown = true;
        hasMoved = false;
        resultsEl.classList.add('is-dragging');
        startX = e.pageX - resultsEl.offsetLeft;
        scrollLeftStart = resultsEl.scrollLeft;
      });

      window.addEventListener('mouseup', function() {
        if (!isDown) return;
        isDown = false;
        resultsEl.classList.remove('is-dragging');
      });

      window.addEventListener('mousemove', function(e) {
        if (!isDown) return;
        e.preventDefault();
        var x = e.pageX - resultsEl.offsetLeft;
        var walk = (x - startX) * 1.35; // moltiplicatore velocità drag
        if (Math.abs(walk) > 4) {
          hasMoved = true;
        }
        resultsEl.scrollLeft = scrollLeftStart - walk;
      });

      // SCROLL ROTTA MOUSE ORIZZONTALE CON SHIFT O NATIVO
      resultsEl.addEventListener('wheel', function(e) {
        if (e.shiftKey) {
          // Gestito nativamente dal browser con shift
          return;
        }
        // Se c'è solo movimento orizzontale
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
          return;
        }
        // Se l'utente preme Alt mentre scrolla con la rotellina, scorre orizzontalmente
        if (e.altKey && e.deltaY !== 0) {
          e.preventDefault();
          resultsEl.scrollLeft += e.deltaY * 1.5;
        }
      }, { passive: false });

      // Inizializza
      syncDimensions();
      handleWindowScroll();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTableScrollEnhancer);
  } else {
    initTableScrollEnhancer();
  }
})();
</script>
